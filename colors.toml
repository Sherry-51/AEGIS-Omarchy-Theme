# ==============================================================================
# AEGIS — DEEP SPACE COMMAND CENTER THEME
# Architecture: Omarchy Linux 4.x / Hyprland / Quickshell
# Palette Schema: Omarchy Native colors.toml specification
# ==============================================================================

mode = "dark"

# Primary Brand & Accent
accent = "#74d7e8"
cursor = "#a5eef5"
selection = "#1b2540"
selection_background = "#1b2540"
selection_foreground = "#d9e2f2"
muted = "#5e6b80"

# Surface & Background Hierarchy
# Deep space darkness, spacecraft telemetry surfaces
background = "#080b14"
dark_background = "#05070d"
darker_background = "#03050a"
lighter_background = "#0d1220"

# Typography Hierarchy
# High contrast, WCAG AAA compliant primary text and technical secondary text
foreground = "#d9e2f2"
dark_foreground = "#5e6b80"
light_foreground = "#93a1b8"
bright_foreground = "#f0f4fc"

# Hyprland Window Borders
hyprland_active_border = "rgba(74d7e8ee) rgba(3e6fa8ee) 45deg"
hyprland_inactive_border = "rgba(141b2daa)"

# Semantic 16-Color Palette (Normal ANSI 0-7)
red = "#d16969"
green = "#6fbf9c"
yellow = "#d6a85e"
blue = "#3e6fa8"
magenta = "#8876b8"
purple = "#8876b8"
cyan = "#74d7e8"
orange = "#d68e5e"
brown = "#5a3d31"

# Semantic 16-Color Palette (Bright ANSI 8-15)
bright_red = "#e98a8a"
bright_green = "#8cd4b3"
bright_yellow = "#e5be7a"
bright_blue = "#5c8ec9"
bright_magenta = "#b1a3d1"
bright_purple = "#b1a3d1"
bright_cyan = "#a5eef5"
